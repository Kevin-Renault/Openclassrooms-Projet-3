name: Build & Analyze

on:
  push:
    branches: [ main, exercice2-implementation ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Make mvnw executable
        run: chmod +x mvnw
      - name: Build with Maven & generate coverage
        run: ./mvnw clean verify
      - name: SonarCloud Scan
        run: ./mvnw sonar:sonar -Dsonar.projectKey=Kevin-Renault_Openclassrooms-Projet-3 -Dsonar.organization=kevin-renault -Dsonar.host.url=https://sonarcloud.io -Dsonar.login=${{ secrets.SONAR_TOKEN }}
